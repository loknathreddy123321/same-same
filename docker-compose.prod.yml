services:
  dashboard:
    image: ${ECR_IMAGE}
    container_name: cfn-drift-fixer
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /cfn-drift-fixer/dashboard
        awslogs-stream: dashboard
        awslogs-create-group: "true"
